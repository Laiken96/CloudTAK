<!DOCTYPE html>
<html
    class='h-full'
    lang="en"
    style='overflow: hidden;'
    data-bs-theme='dark'
    data-bs-theme-base='neutral'
    data-bs-theme-primary='blue'
>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">

        <link rel="manifest" href="/api/manifest.webmanifest" />

        <!-- iOS PWA Settings: ref: https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html?ref=frontendchecklist -->
        <meta name="format-detection" content="telephone=no">
        <!-- PzBat12: the home screen web app draws under a translucent status bar,
             so iOS keeps the same web view size in portrait and landscape -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <!-- PzBat12: the login logo of the instance (falls back to the CloudTAK logo), see api/stateless/lib/logos.ts -->
        <link rel="apple-touch-icon" href="/api/manifest.webmanifest/apple-touch-icon">

        <title>CloudTAK</title>

        <link rel="stylesheet" href="/src/style.scss">
    </head>
    <body class='h-full'>
        <noscript>
            <strong>We're sorry but this site doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>
        <div id="app" class='h-full'></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
