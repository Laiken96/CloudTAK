# Fertige Container-Images für den Server-Betrieb (PzBat 12)
#
# Baut bei jedem Push auf den Branch atak-symbole die eigenen CloudTAK-Images
# (mit deutscher Oberfläche und ATAK-Funktionen) in der GitHub-Cloud und legt
# sie in der GitHub Container Registry ab:
#
#   ghcr.io/<owner>/cloudtak-{api,pmtiles,events,retention}:atak-symbole
#   ghcr.io/<owner>/cloudtak-{api,pmtiles,events,retention}:<commit-sha>
#
# Der Server lädt sie nur noch herunter (docker-compose.pzbat12.yml).
# Unabhängig von ghcr.yml (Upstream, nur bei Tags) und release.yml (npm).
name: PzBat12 Images

on:
  push:
    branches:
      - atak-symbole
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: pzbat12-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: api
            file: ./Dockerfile
          - task: pmtiles
            file: ./tasks/pmtiles/Dockerfile.compose
          - task: events
            file: ./tasks/events/Dockerfile
          - task: retention
            file: ./tasks/retention/Dockerfile.compose
    steps:
      - uses: actions/checkout@v7

      # GHCR verlangt Kleinbuchstaben (Owner "Laiken96" -> "laiken96")
      - name: Image-Name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/cloudtak-${{ matrix.task }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pzbat12-${{ matrix.task }}
          cache-to: type=gha,mode=max,scope=pzbat12-${{ matrix.task }}
