# Pipeline PzBat 12: Container-Images und Debian-Paket
#
# Bei jedem Push auf den Branch atak-symbole (oder von Hand gestartet):
#
# 1. images  – baut die eigenen CloudTAK-Images (deutsche Oberfläche,
#              ATAK-Funktionen) in der GitHub-Cloud und legt sie öffentlich ab:
#                ghcr.io/<owner>/cloudtak-{api,pmtiles,events,retention}
#              Tags: atak-symbole (neuester Stand) und voller Commit-SHA.
# 2. deb     – baut das Paket cloudtak-pzbat12_<version>_all.deb, fest an die
#              Images dieses Commits gebunden, und veröffentlicht es als
#              GitHub-Release (Download auch unter …/releases/latest/download/
#              cloudtak-pzbat12.deb).
#
# Auf den Server kommt eine neue Version nur, wenn dort das neue Paket
# installiert wird (Anleitung: SERVER-PZBAT12.md).
#
# Unabhängig von ghcr.yml (Upstream, nur bei Tags) und release.yml (npm).
# Releases dieser Pipeline legen ihre Tags mit dem GITHUB_TOKEN an und lösen
# deshalb die Tag-Workflows des Upstreams nicht aus.
name: PzBat12 Build

on:
  push:
    branches:
      - atak-symbole
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: pzbat12-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - task: api
            file: ./Dockerfile
          - task: pmtiles
            file: ./tasks/pmtiles/Dockerfile.compose
          - task: events
            file: ./tasks/events/Dockerfile
          - task: retention
            file: ./tasks/retention/Dockerfile.compose
    steps:
      - uses: actions/checkout@v7

      # GHCR verlangt Kleinbuchstaben (Owner "Laiken96" -> "laiken96")
      - name: Image-Name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/cloudtak-${{ matrix.task }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pzbat12-${{ matrix.task }}
          cache-to: type=gha,mode=max,scope=pzbat12-${{ matrix.task }}

  deb:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Upstream-Version + Laufnummer, z. B. 13.123.0+pzbat12.42
      - name: Version
        run: echo "VERSION=$(jq -r .version app/package.json)+pzbat12.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Skripte prüfen
        run: shellcheck packaging/deb/cloudtak-pzbat12 packaging/deb/build-deb.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm

      - name: Paket bauen
        run: packaging/deb/build-deb.sh "$VERSION" "$GITHUB_SHA" dist

      - name: Paket prüfen
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./opt/cloudtak/IMAGE_TAG | grep -qx "$GITHUB_SHA"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pzbat12-${VERSION//+/-}"
          cp "dist/cloudtak-pzbat12_${VERSION}_all.deb" dist/cloudtak-pzbat12.deb
          {
            echo "CloudTAK PzBat 12, Version ${VERSION}"
            echo
            echo "Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudtak-*:${GITHUB_SHA}\`"
            echo
            echo "Installation bzw. Update auf dem Server (Ubuntu 24.04):"
            echo
            echo '```'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/cloudtak-pzbat12_${VERSION}_all.deb"
            echo "sudo apt install ./cloudtak-pzbat12_${VERSION}_all.deb"
            echo '```'
            echo
            echo "Änderung:"
            echo
            git log -1 --pretty='%s%n%n%b' | grep -v '^Co-Authored-By:'
          } > release-notes.md
          gh release create "$TAG" \
            "dist/cloudtak-pzbat12_${VERSION}_all.deb" \
            dist/cloudtak-pzbat12.deb \
            --target "$GITHUB_SHA" \
            --title "CloudTAK PzBat 12 ${VERSION}" \
            --notes-file release-notes.md \
            --latest
